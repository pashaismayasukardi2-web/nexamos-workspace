name: Deploy NexaMOS Workspace to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Auto Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '103.190.0.23' }}
          port: ${{ secrets.VPS_PORT || 4775 }}
          username: ${{ secrets.VPS_USER || 'dsmdsm' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            echo "🚀 [Deploy] Memulai auto-deploy nexamos-workspace..."
            cd ~/nexamos-workspace
            echo "📥 [Git] Menarik pembaruan kode terbaru dari branch main..."
            git pull origin main
            echo "📦 [Dependencies] Menginstal dependensi..."
            npm install --prefer-offline --no-audit
            echo "⚙️ [Build] Membangun Next.js production build..."
            npm run build
            echo "🔄 [PM2] Reloading service nexamos-workspace..."
            pm2 reload nexamos-workspace || pm2 restart nexamos-workspace
            pm2 save
            echo "✅ [Sukses] Deployment nexamos-workspace berhasil dan aktif!"
